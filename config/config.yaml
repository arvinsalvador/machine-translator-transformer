project:
  name: "English-Tagalog Transformer Translator"
  version: "0.1.0"
  random_seed: 42
dataset:
  name: "visheratin/laion-coco-nllb"
  split: "train"
  source_language:
    name: "English"
    code: "eng"
    field: "eng_caption"
  target_language:
    name: "Tagalog"
    code: "tgl_Latn"
  max_samples: 20000
  quick_samples: 1000
  train_ratio: 0.80
  validation_ratio: 0.10
  test_ratio: 0.10
  max_sentence_length: 64
  acquisition:
    scan_multiplier: 3
    output_file: "data/raw/en_tl_pairs.jsonl"
    metadata_file: "data/raw/acquisition_metadata.json"
    preview_rows: 5
tokenizer:
  type: "sentencepiece_bpe"
  model_type: "bpe"
  vocab_size: 8000
  character_coverage: 1.0
  model_prefix: "data/tokenizer/en_tl"
  metadata_file: "tokenizer_metadata.json"
  special_tokens:
    pad: "<pad>"
    unknown: "<unk>"
    bos: "<s>"
    eos: "</s>"
model:
  d_model: 128
  attention_heads: 4
  encoder_layers: 2
  decoder_layers: 2
  feedforward_dimension: 512
  dropout: 0.1
  max_sequence_length: 64
training:
  batch_size: 16
  epochs: 5
  learning_rate: 0.0003
  optimizer: "adamw"
  gradient_clip_norm: 1.0
  shuffle: true
  early_stopping:
    enabled: true
    patience: 2
  checkpoint:
    save_best_only: false
    best_file: "models/checkpoints/best_model.pt"
    last_file: "models/checkpoints/last_model.pt"
    history_file: "models/checkpoints/training_history.json"
    metadata_file: "models/checkpoints/training_metadata.json"
  profiles:
    quick:
      max_train_records: 1000
      max_validation_records: 200
      epochs: 2
    normal:
      max_train_records: null
      max_validation_records: null
      epochs: 5
resources:
  prefer_gpu: true
  allow_cpu_fallback: true
  dataloader_workers: 2
  max_cpu_threads: 2

preprocessing:
  normalize_unicode: true
  collapse_whitespace: true
  remove_control_characters: true
  deduplicate: true
  min_words: 1
  max_words: 50
  max_characters: 500
  output_directory: "data/processed"
  train_file: "train.jsonl"
  validation_file: "validation.jsonl"
  test_file: "test.jsonl"
  metadata_file: "preparation_metadata.json"
  preview_rows: 5

evaluation:
  default_max_samples: 200
  maximum_samples: 2000
  decoding: "greedy"
  results_file: "models/checkpoints/evaluation_results.json"
  example_limit: 10
